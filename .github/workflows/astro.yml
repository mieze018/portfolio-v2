name: Astro migration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  real-content:
    # Why: シークレットを使う検証は同一リポジトリの PR に限り、fork や Dependabot では実行しない。
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build real CMS content
        env:
          TUMBLR_API_KEY: ${{ secrets.TUMBLR_API_KEY || secrets.NEXT_PUBLIC_api_Key }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NEXT_PUBLIC_NOTION_TOKEN }}
        run: |
          if [ -z "$TUMBLR_API_KEY" ] || [ -z "$NOTION_TOKEN" ]; then
            echo '::error::Tumblr or Notion build secret is not configured for this repository.'
            exit 1
          fi
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check real content in desktop and mobile browsers
        run: pnpm exec playwright test --config playwright.real.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-content-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  static-site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
