services:
  app: &app
    image: node:22.23.4
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      ASTRO_TELEMETRY_DISABLED: '1'
      CYPRESS_INSTALL_BINARY: '0'
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm dev:fixtures --host 0.0.0.0 --port 3001 --ignore-lock"
    ports:
      - '3001:3001'
  storybook:
    <<: *app
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm storybook --ci --no-open --host 0.0.0.0"
    ports:
      - '6006:6006'
